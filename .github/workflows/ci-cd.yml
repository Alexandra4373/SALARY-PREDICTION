name: CI-CD
on:
  push:
    branches: [main] # run when code reaches main
  pull_request: # also run on pull requests

jobs:
  test: # CI: check that the code works
    runs-on: ubuntu-latest # a free GitHub machine
    steps:
      - uses: actions/checkout@v4 # download your repo
      - uses: actions/setup-python@v5 # install Python
        with:
          python-version: "3.14" # same as your computer and Dockerfile
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q # run your tests
      - run: docker build -t salary-api . # check the image builds

  publish: # CD: only after tests pass, only on main
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allow pushing to GitHub's registry
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3 # log in to ghcr.io
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub supplies this automatically
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/salary-api   # ,, makes it lowercase (required)
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
